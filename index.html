<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streak-Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <!-- ================= HOME ================= -->
    <nav class="nav-bar">
        <div class="nav-brand">
            <h1><b>WELCOME TO STREAK-COUNTER</b></h1>
            <h5>Your Personal Streak-Counter</h5>
        </div>

        <div class="nav-buttons">
            <a href="#home">Home</a>
            <a href="#friends">Friends</a>
            <a href="#profile">Profile</a>
        </div>
    </nav>
    
    <section id="home">
        <div id="central_word">CURRENT STREAKS</div>

        <div class="home-content">
            <div class="streak-list">
                <div class="streak-item">
                    <div class="streak-icon">🔥<span>86</span></div>
                    <p>Reading a book</p>
                </div>
                <div class="streak-item">
                    <div class="streak-icon">🔥<span>17</span></div>
                    <p>Practice Listening</p>
                </div>
        
            <!-- ================= FRIENDS ================= -->
    <table id="table" >
        <tr>
            <th>FRIENDS</th>
            <th>BEST STREAKS</th>
            <th>CURRENT-STREAK</th>
        </tr>
        <!--INNER-->
        <tr>
            <td>Adam M.</td>
            <td>Jonny D.</td>
            <td>David M.</td>
        </tr>
        <tr>
            <td>32</td>
            <td>12</td>
            <td>32</td>
        </tr>
        <tr>
            <td>5</td>
            <td>5</td>
            <td>6</td>
        </tr>
    </table>
</body>
</html>
