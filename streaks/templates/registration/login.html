{% extends 'streaks/base.html' %}

{% block title %}Log in · Streak Counter{% endblock %}

{% block content %}
  <h1 class="page-title">🔥 Welcome back</h1>

  <section class="card form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-links">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
  </section>
{% endblock %}
