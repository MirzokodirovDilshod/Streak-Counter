{% extends 'streaks/base.html' %}

{% block title %}Sign up · Streak Counter{% endblock %}

{% block content %}
  <h1 class="page-title">🔥 Create your account</h1>

  <section class="card form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary btn-block">Sign up</button>
    </form>

    <p class="auth-links">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
  </section>
{% endblock %}
