<h1>Current Streaks</h1>
<ul>
  {% for c in counters %}  
    <li>{{ c.title }}: {{ c.current_streak }}
      <a href="{%url 'done' c.id %}">Compleated</a>
    </li>
  {% endfor %}
</ul>

<form action="{% url 'add_counter' %}" method="post">  
  {% csrf_token %}
  <input type="text" name='title'>    
  <button type="submit">Qo'shish</button>
</form>

{% if quote %}
  <p>{{ quote.text }}</p>
  <p>{{ quote.author }}</p>
{% endif %}
