{% extends 'streaks/base.html' %}

{% block title %}Edit counter · Streak Counter{% endblock %}

{% block content %}
  <h1 class="page-title">Edit counter</h1>

  <section class="card form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions-row">
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-ghost" href="{% url 'home' %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
