{% extends 'streaks/base.html' %}

{% block title %}Profile · Streak Counter{% endblock %}

{% block content %}
  <h1 class="page-title">Profile</h1>

  <section class="card form-card avatar-card">
    {% if user.profile.avatar %}
      <img class="avatar" src="{{ user.profile.avatar.url }}" alt="Your avatar">
    {% else %}
      <div class="avatar avatar-empty">{{ user.username|first|upper }}</div>
    {% endif %}
    <form action="{% url 'upload_avatar' %}" method="post" enctype="multipart/form-data" class="avatar-form">
      {% csrf_token %}
      <input type="file" name="avatar" accept="image/*" required>
      <button type="submit" class="btn btn-primary">Upload</button>
    </form>
  </section>

  <section class="card form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
  </section>
{% endblock %}
