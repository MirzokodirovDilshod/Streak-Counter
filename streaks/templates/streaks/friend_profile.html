{% extends 'streaks/base.html' %}

{% block content %}
  <h1>{{ friend.username }}</h1>

  <ul>
    {% for c in counters %}
      <li>{{ c.title }}: {{ c.display_streak }}</li>
    {% empty %}
      <li>There are no counters yet</li>
    {% endfor %}
  </ul>

  <a href="{% url 'friends' %}">Back to friends</a>
{% endblock %}
