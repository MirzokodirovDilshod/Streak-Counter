{% extends 'streaks/base.html' %}

{% block content %}
  <h1>{{ friend.username }}</h1>

  <ul>
    {% for c in counters %}
      <li>{{ c.title }}: {{ c.display_streak }}</li>
    {% empty %}
      <li>There are no counters yet</li>
    {% endfor %}
  </ul>
  
  <form action="{% url 'remove_friend' friend.id %}" method="post"
        onsubmit="return confirm('Remove this friend?')">
    {% csrf_token %}
    <button type="submit">Remove friend</button>
  </form>
  <a href="{% url 'friends' %}">Back to friends</a>
{% endblock %}
